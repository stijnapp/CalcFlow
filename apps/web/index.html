<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The keyboard shrinks the page to what is left above it. Left to overlay
      the page instead, Android slid everything up a moment after it arrived,
      by however much it took to reveal the field — which is what sent the key
      bar and the canvas's line into the middle of the screen, and made the
      page scroll by amounts nobody could predict.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1, interactive-widget=resizes-content"
    />
    <!-- The colour Android paints the status bar with, so the bars read as part
         of the app rather than as a black band above it. -->
    <meta name="theme-color" content="#141210" />
    <!-- The theme, before anything is painted: the settings only arrive once the
         app has loaded, and a light page would flash dark until then. The same
         choice as lib/theme.ts makes, from the copy it keeps for this. -->
    <script>
      (function () {
        var theme = 'system';
        try {
          theme = localStorage.getItem('calcflow.theme') || theme;
        } catch (e) {}
        var light =
          theme === 'light' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        if (light) {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3efe9');
        }
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="CalcFlow" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>CalcFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
